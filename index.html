<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учет проблемных договоров — Исламский росточек</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-light: #2d6a4f;
      --accent: #52b788;
      --bg: #f4f6f4;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --danger: #e63946;
      --warning: #faa261;
      --success: #2a9d8f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; }
    .container { max-width: 1000px; margin: 0 auto; }

    /* Шапка */
    .header {
      background: var(--primary);
      color: white;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .header p { font-size: 0.85rem; opacity: 0.8; }
    
    .btn {
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    /* Табы */
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Фильтры */
    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }
    .input-field, .select-field {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    /* Таблица */
    .table-container { background: white; border-radius: 8px; overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; color: var(--text-muted); font-weight: 600; }

    /* Статусы */
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      display: inline-block;
    }
    .badge- уважительная { background: #e3f2fd; color: #0d47a1; }
    .badge- наглый { background: #ffebee; color: #c62828; }
    .badge- неорганизованный { background: #fff3e0; color: #ef6c00; }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
    }
    .modal-header { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-secondary { background: #ccc; color: #333; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>Учет проблемных договоров</h1>
      <p>Система контроля работы (Исламский росточек)</p>
    </div>
    <button class="btn" id="openModalBtn">+ Добавить проблемный договор</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabActive">Активные проблемные (<span id="countActive">0</span>)</button>
    <button class="tab-btn" id="tabClosed">Закрытые / Урегулированные (<span id="countClosed">0</span>)</button>
  </div>

  <div class="filters">
    <input type="text" id="searchInput" class="input-field" placeholder="Поиск по ФИО или договору...">
    <select id="filterType" class="select-field">
      <option value="all">Все типы клиентов</option>
      <option value="уважительная">Затруднение (уважительная)</option>
      <option value="наглый">Уклоняется / Наглый</option>
      <option value="неорганизованный">Забыл / Неорганизованный</option>
    </select>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>№ / Договор</th>
          <th>Клиент & Контакты</th>
          <th>Сумма долга</th>
          <th>Тип клиента</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody id="contractsTableBody">
        <!-- Данные подгружаются через JavaScript -->
      </tbody>
    </table>
  </div>
</div>

<!-- Модальное окно добавления -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">Новый проблемный договор</div>
    <form id="addContractForm">
      <div class="form-group">
        <label>№ Договора</label>
        <input type="text" id="docNum" class="input-field" required>
      </div>
      <div class="form-group">
        <label>ФИО Клиента</label>
        <input type="text" id="clientName" class="input-field" required>
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="text" id="clientPhone" class="input-field" required>
      </div>
      <div class="form-group">
        <label>Сумма долга (руб.)</label>
        <input type="number" id="debtAmount" class="input-field" required>
      </div>
      <div class="form-group">
        <label>Тип клиента</label>
        <select id="clientType" class="select-field">
          <option value="уважительная">Затруднение (уважительная)</option>
          <option value="наглый">Уклоняется / Наглый</option>
          <option value="неорганизованный">Забыл / Неорганизованный</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="closeModalBtn">Отмена</button>
        <button type="submit" class="btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Локальная база данных (хранится в браузере)
  let contracts = JSON.parse(localStorage.getItem('contracts')) || [
    { id: 1, doc: 'Д-101', name: 'Иванов И.И.', phone: '+7 999 000-00-01', amount: 15000, type: 'уважительная', status: 'active' },
    { id: 2, doc: 'Д-102', name: 'Петров П.П.', phone: '+7 999 000-00-02', amount: 45000, type: 'наглый', status: 'active' }
  ];

  let currentTab = 'active';

  // Элементы DOM
  const tableBody = document.getElementById('contractsTableBody');
  const modal = document.getElementById('modal');
  const openModalBtn = document.getElementById('openModalBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const form = document.getElementById('addContractForm');
  const tabActive = document.getElementById('tabActive');
  const tabClosed = document.getElementById('tabClosed');
  const searchInput = document.getElementById('searchInput');
  const filterType = document.getElementById('filterType');

  // Сохранение в LocalStorage
  function saveData() {
    localStorage.setItem('contracts', JSON.stringify(contracts));
    render();
  }

  // Переключение статуса договора (Закрыть / Восстановить)
  window.toggleStatus = function(id) {
    contracts = contracts.map(item => {
      if (item.id === id) {
        item.status = item.status === 'active' ? 'closed' : 'active';
      }
      return item;
    });
    saveData();
  };

  // Отрисовка таблицы
  function render() {
    const search = searchInput.value.toLowerCase();
    const typeFilter = filterType.value;

    const filtered = contracts.filter(item => {
      const matchesTab = item.status === currentTab;
      const matchesSearch = item.name.toLowerCase().includes(search) || item.doc.toLowerCase().includes(search);
      const matchesType = typeFilter === 'all' || item.type === typeFilter;
      return matchesTab && matchesSearch && matchesType;
    });

    // Обновление счетчиков
    document.getElementById('countActive').innerText = contracts.filter(c => c.status === 'active').length;
    document.getElementById('countClosed').innerText = contracts.filter(c => c.status === 'closed').length;

    tableBody.innerHTML = '';
    if (filtered.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#999;">Записи не найдены</td></tr>';
      return;
    }

    filtered.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${item.doc}</strong></td>
        <td>${item.name}<br><small style="color:var(--text-muted);">${item.phone}</small></td>
        <td><strong>${Number(item.amount).toLocaleString('ru-RU')} ₽</strong></td>
        <td><span class="badge badge-${item.type}">${item.type}</span></td>
        <td>
          <button class="btn" style="padding: 4px 8px; font-size:0.75rem;" onclick="toggleStatus(${item.id})">
            ${item.status === 'active' ? 'Закрыть' : 'Восстановить'}
          </button>
        </td>
      `;
      tableBody.appendChild(tr);
    });
  }

  // Управление модальным окном
  openModalBtn.onclick = () => modal.classList.add('active');
  closeModalBtn.onclick = () => modal.classList.remove('active');

  // Добавление договора
  form.onsubmit = (e) => {
    e.preventDefault();
    const newContract = {
      id: Date.now(),
      doc: document.getElementById('docNum').value,
      name: document.getElementById('clientName').value,
      phone: document.getElementById('clientPhone').value,
      amount: document.getElementById('debtAmount').value,
      type: document.getElementById('clientType').value,
      status: 'active'
    };
    contracts.push(newContract);
    saveData();
    form.reset();
    modal.classList.remove('active');
  };

  // Переключение табов
  tabActive.onclick = () => {
    tabActive.classList.add('active');
    tabClosed.classList.remove('active');
    currentTab = 'active';
    render();
  };

  tabClosed.onclick = () => {
    tabClosed.classList.add('active');
    tabActive.classList.remove('active');
    currentTab = 'closed';
    render();
  };

  // События поиска и фильтрации
  searchInput.oninput = render;
  filterType.onchange = render;

  // Инициализация
  render();
</script>

</body>
</html>
